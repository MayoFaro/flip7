<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Flip 7 – Assistant</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Flip 7 – Assistant hit/stay</h1>

  <div id="status-bar">
    <section id="result-panel">
      <p id="bust-line">Bust : <span id="prob-bust">–</span>%</p>
      <p id="recommendation">–</p>
    </section>

    <section id="controls">
      <button id="undo-btn">Annuler</button>
      <button id="new-round-btn">Round</button>
      <button id="reshuffle-btn">Reshuffle</button>
      <button id="new-game-btn">Partie</button>
    </section>
  </div>

  <div id="catalogs-row">
    <section id="seen-grid">
      <h2>Autres joueurs</h2>
      <p>Ou mes cartes si je buste.</p>
      <div class="chip-columns">
        <div id="seen-grid-numbers" class="chip-row"></div>
        <div id="seen-grid-specials" class="chip-row"></div>
      </div>
    </section>

    <section id="line-grid">
      <h2>Ma ligne</h2>
      <h3>Actuelle</h3>
      <div id="my-cards"></div>
      <h3>Ajouter</h3>
      <div class="chip-columns">
        <div id="line-grid-numbers" class="chip-row"></div>
        <div id="line-grid-specials" class="chip-row"></div>
      </div>
    </section>

    <section id="pool-grid">
      <h2>Échange</h2>
      <p>Déjà tiré, pas dans ma ligne.</p>
      <div id="pool-grid-items"></div>
    </section>
  </div>

  <section id="manual-edit">
    <h2>Correction manuelle du nombre de cartes vues</h2>
  </section>

  <script type="module" src="app.mjs"></script>
</body>
</html>
